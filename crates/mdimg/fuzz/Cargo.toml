[package]
name = "fuzz"
version = "0.1.0"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
mdimg = { path = ".." }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "replace_images"
path = "fuzz_targets/replace_images.rs"
test = false
doc = false
bench = false


# Prevent this from interfering with workspaces
[workspace]
members = ["."]

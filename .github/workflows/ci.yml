name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/check.yml

  build:
    name: Build artifacts
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/build.yml

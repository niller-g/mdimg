name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  build:
    name: Build artifacts
    needs: check
    uses: ./.github/workflows/build.yml

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package mdimg --no-verify

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: mdimg-wheel-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v7
        with:
          name: mdimg-sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish GitHub release
    needs: [build, publish-crate, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: artifacts

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
